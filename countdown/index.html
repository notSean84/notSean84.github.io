<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face {
    font-family: "Faktum";
    src: url("Rene%20Bieder%20-%20Faktum%20SemiBold.otf") format("opentype");
    font-display: swap;
  }
  html, body {
    margin: 0;
    height: 100%;
    background-color: #dde2e9;
    display: grid;
    place-items: center;
  }
  #countdown {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    font-family: "Faktum", "DIN Alternate", Arial, sans-serif;
    font-size: clamp(1.5rem, 11vw, 8rem);
    color: #003f7d;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .num {
    line-height: 1.1;
  }
  .label {
    font-size: 0.2em;
    color: #0f4196;
    margin-top: 0.2em;
  }
  .sep {
    line-height: 1.1;
    padding: 0 0.25em;
  }
</style>
</head>
<body>
  <div id="countdown" aria-live="off">
    <div class="unit"><span class="num" id="d">00</span><span class="label">Days</span></div>
    <span class="sep">:</span>
    <div class="unit"><span class="num" id="h">00</span><span class="label">Hours</span></div>
    <span class="sep">:</span>
    <div class="unit"><span class="num" id="m">00</span><span class="label">Minutes</span></div>
    <span class="sep">:</span>
    <div class="unit"><span class="num" id="s">00</span><span class="label">Seconds</span></div>
  </div>
<script>
  const ziel = new Date("2027-01-11T00:00:00+01:00");
  const p = n => String(n).padStart(2, "0");
  const $ = id => document.getElementById(id);

  function tick() {
    let d = Math.max(0, ziel - new Date());
    const tage = Math.floor(d / 864e5); d %= 864e5;
    const std  = Math.floor(d / 36e5);  d %= 36e5;
    const min  = Math.floor(d / 6e4);   d %= 6e4;
    const sek  = Math.floor(d / 1e3);
    $("d").textContent = p(tage);
    $("h").textContent = p(std);
    $("m").textContent = p(min);
    $("s").textContent = p(sek);
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
