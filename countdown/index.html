<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "MeineFont";
    src: url("Rene Bieder - Faktum SemiBold.otf") format("otf");
    font-display: swap;
  }
  html, body {
    margin: 0;
    height: 100%;
    display: grid;
    place-items: center;
    background: transparent;
    font-family: "MeineFont", sans-serif;
    color: #111;
  }
  #countdown { font-size: 4rem; text-align: center; }
  small { display: block; font-size: 1rem; opacity: .7; }
</style>
</head>
<body>
  <div id="countdown"></div>
<script>
  const ziel = new Date("2026-12-31T23:59:59+01:00");
  const el = document.getElementById("countdown");
  function tick() {
    let d = Math.max(0, ziel - new Date());
    const tage = Math.floor(d / 864e5); d %= 864e5;
    const std = Math.floor(d / 36e5); d %= 36e5;
    const min = Math.floor(d / 6e4); d %= 6e4;
    const sek = Math.floor(d / 1e3);
    el.innerHTML = `${tage}T ${String(std).padStart(2,"0")}:${String(min).padStart(2,"0")}:${String(sek).padStart(2,"0")}<small>bis zum Start</small>`;
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
