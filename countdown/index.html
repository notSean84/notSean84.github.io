<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face {
    font-family: "Faktum";
    src: url("countdown/Rene Bieder - Faktum SemiBold.otf") format("otf");
    font-display: swap;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    display: grid;
    place-items: center;
  }
  #countdown {
    font-family: "Faktum", "DIN Alternate", Arial, sans-serif;
    font-size: clamp(2rem, 11vw, 4.5rem);
    color: #003C75;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div id="countdown" aria-live="off">00 : 00 : 00 : 00</div>
<script>
  const ziel = new Date("2027-01-11T00:00:00+01:00");
  const el = document.getElementById("countdown");
  const p = n => String(n).padStart(2, "0");

  function tick() {
    let d = Math.max(0, ziel - new Date());
    const tage = Math.floor(d / 864e5); d %= 864e5;
    const std  = Math.floor(d / 36e5);  d %= 36e5;
    const min  = Math.floor(d / 6e4);   d %= 6e4;
    const sek  = Math.floor(d / 1e3);
    el.textContent = `${p(tage)} : ${p(std)} : ${p(min)} : ${p(sek)}`;
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
